- name: Install & Connect Tailscale
  shell: pwsh
  env:
    TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
  run: |
    Write-Host "=== Installing Tailscale ==="
    # 修复1：使用可访问的镜像地址（解决404）+ 英文引号
    $tsInstallerUrl = "https://mirror.ghproxy.com/https://pkgs.tailscale.com/stable/windows/tailscale-setup.exe"
    $tsInstallerPath = "tailscale.exe"
    
    # 修复2：增加3次下载重试（解决网络波动）
    $retryCount = 3
    $downloadSuccess = $false
    while ($retryCount -gt 0 -and -not $downloadSuccess) {
      try {
        Write-Host "Downloading Tailscale (Retry $($retryCount))..."
        # 修复3：设置超时+禁用SSL验证（避免证书问题）
        Invoke-WebRequest -Uri $tsInstallerUrl -OutFile $tsInstallerPath -TimeoutSec 60 -UseBasicParsing -SslProtocol Tls12
        $downloadSuccess = $true
        Write-Host "✅ Tailscale installer downloaded successfully"
      } catch {
        $retryCount--
        Write-Warning "Download failed: $_"
        if ($retryCount -gt 0) {
          Start-Sleep -Seconds 5
        }
      }
    }
    
    # 下载失败则终止
    if (-not $downloadSuccess) {
      Write-Error "❌ Failed to download Tailscale after 3 retries (404/network error)"
      exit 1
    }

    # 静默安装Tailscale
    Write-Host "Installing Tailscale silently..."
    Start-Process -FilePath $tsInstallerPath -ArgumentList "/silent" -Wait -NoNewWindow
    
    # 验证安装是否成功
    if (-not (Get-Command "tailscale" -ErrorAction SilentlyContinue)) {
      Write-Error "❌ Tailscale installation failed (executable not found)"
      exit 1
    }

    # 验证密钥配置
    if (-not $env:TAILSCALE_AUTH_KEY) {
      Write-Error "❌ TAILSCALE_AUTH_KEY is missing! Add it to GitHub Secrets."
      exit 1
    }

    # 连接Tailscale网络
    Write-Host "Connecting to Tailscale..."
    try {
      tailscale up --authkey $env:TAILSCALE_AUTH_KEY --hostname "Windows-RDP-EN" --timeout 30s
      $tsIP = tailscale ip -4
      
      if (-not $tsIP -or $tsIP -eq "") {
        Write-Error "❌ Failed to get Tailscale IP (connection failed)"
        exit 1
      }
      
      # 保存IP到环境变量
      echo "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
      Write-Host "✅ Tailscale connected successfully! IP: $tsIP"
    } catch {
      Write-Error "❌ Tailscale connection failed: $_"
      exit 1
    }
