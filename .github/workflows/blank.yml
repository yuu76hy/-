name: Windows RDP Server（中文+5位密码+5小时）
on:
  workflow_dispatch:  # 仅手动触发

jobs:
  windows-rdp:
    runs-on: windows-latest  # 强制使用Windows环境（关键！）
    timeout-minutes: 300     # 5小时超时
    env:
      RDP_USER: vum          # RDP用户名
      RUN_DURATION: 18000    # 5小时=18000秒

    steps:
      # 步骤1：安装中文语言包+配置中文系统
      - name: 配置Windows中文环境
        shell: pwsh
        run: |
          Write-Host "=== 安装中文语言包 ==="
          # 安装简体中文基础语言包
          Add-WindowsCapability -Online -Name Language.Basic~~~zh-CN~0.0.1.0 -ErrorAction SilentlyContinue
          # 设置系统/用户语言为中文
          Set-WinSystemLocale zh-CN
          Set-WinUserLanguageList zh-CN -Force
          Set-WinUILanguageOverride zh-CN
          Set-Culture zh-CN
          # 设置北京时间
          tzutil /s "China Standard Time"
          Write-Host "✅ 中文环境配置完成"

      # 步骤2：启用RDP远程桌面
      - name: 启用并配置RDP
        shell: pwsh
        run: |
          Write-Host "=== 配置RDP服务 ==="
          # 启用RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          # 开放3389端口
          New-NetFirewallRule -DisplayName "允许RDP" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
          # 重启RDP服务
          Restart-Service TermService -Force
          Write-Host "✅ RDP服务已启用"

      # 步骤3：创建RDP用户（5位数字密码）
      - name: 创建RDP用户（5位数字密码）
        shell: pwsh
        run: |
          Write-Host "=== 创建RDP用户 ==="
          # 生成5位随机数字密码（10000-99999）
          $password = Get-Random -Minimum 10000 -Maximum 99999
          # 保存密码到环境变量
          echo "RDP_PWD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          # 创建本地用户
          $securePwd = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePwd -AccountNeverExpires -ErrorAction SilentlyContinue
          # 添加管理员权限
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Write-Host "✅ 用户创建完成，密码：$password"

      # 步骤4：安装Tailscale（用于RDP访问）
      - name: 安装并连接Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== 安装Tailscale ==="
          # 下载Tailscale安装包
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/windows/tailscale-setup.exe" -OutFile "tailscale.exe"
          # 静默安装
          Start-Process -FilePath .\tailscale.exe -ArgumentList "/silent" -Wait
          
          # 连接Tailscale
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "❌ 请先在仓库Secrets中添加TAILSCALE_AUTH_KEY！"
            exit 1
          }
          tailscale up --authkey $env:TAILSCALE_AUTH_KEY --hostname "Windows-RDP-zh"
          # 获取Tailscale IP
          $tsIP = tailscale ip -4
          echo "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ Tailscale连接成功，IP：$tsIP"

      # 步骤5：显示RDP访问信息+保持连接5小时
      - name: 显示访问信息+保持连接
        shell: pwsh
        run: |
          Write-Host "`n========================================"
          Write-Host "📡 中文Windows RDP 访问信息"
          Write-Host "========================================"
          Write-Host "🔌 Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "👤 用户名: $env:RDP_USER"
          Write-Host "🔑 密码: $env:RDP_PWD"
          Write-Host "⏰ 有效期: 5小时"
          Write-Host "⚠️  关闭工作流后所有数据失效！"
          Write-Host "========================================`n"
          
          # 保持连接5小时
          $start = Get-Date
          while ($true) {
            $elapsed = (Get-Date) - $start
            if ($elapsed.TotalSeconds -ge $env:RUN_DURATION) {
              Write-Host "⏰ 5小时已到，自动终止"
              exit 0
            }
            $remaining = [math]::Round(($env:RUN_DURATION - $elapsed.TotalSeconds)/60)
            Write-Host "[$(Get-Date)] 运行中 - 已运行$([math]::Round($elapsed.TotalMinutes))分钟 | 剩余$remaining分钟"
            Start-Sleep -Seconds 300
          }
