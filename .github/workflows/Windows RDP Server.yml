name: Windows RDP Server (Tailscale + 5-digit Password)
on:
  workflow_dispatch:  # 仅手动触发

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 300  # 5小时超时
    env:
      RDP_USER: vum       # RDP登录用户名
      RUN_DURATION: 18000 # 5小时=18000秒

    steps:
      # 步骤1：启用RDP远程桌面服务
      - name: Enable RDP Service
        shell: pwsh
        run: |
          Write-Host "=== Enabling RDP Service ==="
          # 启用RDP注册表项
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          # 开放3389端口防火墙
          New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
          # 重启RDP服务确保生效
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Write-Host "✅ RDP Service enabled successfully"

      # 步骤2：创建RDP用户（5位数字密码）
      - name: Create RDP User (5-digit Password)
        shell: pwsh
        run: |
          Write-Host "=== Creating RDP User ==="
          # 生成5位随机阿拉伯数字密码（10000-99999）
          $password = Get-Random -Minimum 10000 -Maximum 99999
          # 保存密码到环境变量供后续使用
          echo "RDP_PWD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          # 创建本地用户（已存在则忽略）
          $securePwd = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePwd -AccountNeverExpires -ErrorAction SilentlyContinue
          # 将用户添加到管理员组
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Write-Host "✅ RDP User created! Username: $env:RDP_USER | Password: $password"

      # 步骤3：通过winget安装Tailscale（无手动下载，避开404/文件类型问题）
      - name: Install Tailscale via winget
        shell: pwsh
        run: |
          Write-Host "=== Installing Tailscale via winget ==="
          # 确保winget可用（Windows 10/11内置）
          if (-not (Get-Command "winget" -ErrorAction SilentlyContinue)) {
            Write-Error "❌ winget is not available on this system"
            exit 1
          }
          
          # 静默安装Tailscale（自动接受协议）
          winget install --id Tailscale.Tailscale `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          
          # 验证安装结果
          Start-Sleep -Seconds 10 # 等待安装完成
          if (Get-Command "tailscale" -ErrorAction SilentlyContinue) {
            Write-Host "✅ Tailscale installed successfully via winget"
          } else {
            Write-Error "❌ Tailscale installation failed"
            exit 1
          }

      # 步骤4：连接Tailscale网络并获取访问IP
      - name: Connect to Tailscale Network
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Connecting to Tailscale ==="
          # 验证密钥是否配置
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "❌ TAILSCALE_AUTH_KEY is missing! Add it to GitHub Repository Secrets."
            exit 1
          }
          
          # 停止旧的Tailscale服务避免冲突
          Stop-Service -Name tailscaled -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          
          # 连接Tailscale（设置超时和主机名）
          try {
            tailscale up --authkey $env:TAILSCALE_AUTH_KEY `
              --hostname "Windows-RDP-EN" `
              --timeout 60s `
              --accept-dns=false `
              --accept-routes=false
          
            # 获取Tailscale内网IP
            $tsIP = tailscale ip -4
            if (-not $tsIP -or $tsIP -eq "") {
              Write-Error "❌ Failed to get Tailscale IP address"
              exit 1
            }
          
            # 保存IP到环境变量
            echo "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "✅ Tailscale connected! Access IP: $tsIP"
          } catch {
            Write-Error "❌ Tailscale connection failed: $_"
            exit 1
          }

      # 步骤5：显示RDP访问信息+保持5小时连接
      - name: Show RDP Info & Keep Alive
        shell: pwsh
        run: |
          Write-Host "`n========================================"
          Write-Host "📡 Windows RDP Access Information"
          Write-Host "========================================"
          Write-Host "🔌 Tailscale IP (RDP Address): $env:TAILSCALE_IP"
          Write-Host "👤 RDP Username: $env:RDP_USER"
          Write-Host "🔑 RDP Password: $env:RDP_PWD"
          Write-Host "⏰ Expiration Time: 5 Hours"
          Write-Host "⚠️  All data will be lost after workflow ends!"
          Write-Host "========================================`n"
          
          # 保持连接5小时后自动终止
          $startTime = Get-Date
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalSeconds -ge $env:RUN_DURATION) {
              Write-Host "⏰ 5 Hours expired! Workflow terminating..."
              exit 0
            }
            # 实时显示运行时长和剩余时长
            $elapsedMins = [math]::Round($elapsed.TotalMinutes)
            $remainingMins = [math]::Round(($env:RUN_DURATION - $elapsed.TotalSeconds)/60)
            Write-Host "[$(Get-Date)] Running - Elapsed: $elapsedMins mins | Remaining: $remainingMins mins"
            Start-Sleep -Seconds 300 # 每5分钟输出一次状态
          }
