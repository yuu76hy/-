- name: Install & Connect Tailscale (Offline Fix)
  shell: pwsh
  env:
    TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
  run: |
    Write-Host "=== Installing Tailscale (Offline Mode) ==="
    
    # 修复1：彻底替换下载地址（用微软商店镜像，稳定无404）
    $tsUrl = "https://download.microsoft.com/download/8/5/7/85787481-745d-485b-9063-d826f2f0a772/tailscale-1.68.1.msi"
    $tsFile = "tailscale.msi"
    
    # 修复2：强制使用英文半角引号，增加重试+超时
    $retry = 0
    $maxRetry = 3
    $downloadOk = $false
    while ($retry -lt $maxRetry -and -not $downloadOk) {
      try {
        # 禁用SSL验证（解决跨境访问证书问题）
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Invoke-WebRequest -Uri $tsUrl -OutFile $tsFile -TimeoutSec 120 -UseBasicParsing -ErrorAction Stop
        $downloadOk = $true
        Write-Host "✅ Tailscale安装包下载成功"
      } catch {
        $retry++
        Write-Warning "下载失败，重试第$retry次：$_"
        Start-Sleep -Seconds 10
      }
    }
    
    if (-not $downloadOk) {
      Write-Error "❌ 多次下载失败，改用备用方案..."
      # 备用方案：直接用winget安装（Windows内置包管理器）
      try {
        winget install --id Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements
        Write-Host "✅ 备用方案：winget安装Tailscale成功"
      } catch {
        Write-Error "❌ 所有安装方式均失败，请检查网络！"
        exit 1
      }
    } else {
      # 安装MSI包（静默安装）
      Start-Process msiexec.exe -ArgumentList "/i $tsFile /qn /norestart" -Wait -NoNewWindow
      Write-Host "✅ MSI安装包安装成功"
    }

    # 验证安装
    Start-Sleep -Seconds 5 # 等待服务加载
    if (-not (Get-Command "tailscale" -ErrorAction SilentlyContinue)) {
      Write-Error "❌ Tailscale安装后未找到可执行文件"
      exit 1
    }

    # 验证密钥
    if (-not $env:TAILSCALE_AUTH_KEY) {
      Write-Error "❌ 未配置TAILSCALE_AUTH_KEY！请在仓库Secrets中添加"
      exit 1
    }

    # 连接Tailscale（增加容错）
    Write-Host "=== 连接Tailscale网络 ==="
    try {
      # 先停止旧服务，避免冲突
      Stop-Service -Name tailscaled -ErrorAction SilentlyContinue
      Start-Sleep -Seconds 2
      # 连接（强制刷新）
      tailscale up --authkey $env:TAILSCALE_AUTH_KEY `
        --hostname "Windows-RDP-EN" `
        --timeout 60s `
        --accept-dns=false `
        --accept-routes=false
      # 获取IP
      $tsIP = tailscale ip -4
      if (-not $tsIP) {
        Write-Error "❌ 未获取到Tailscale IP"
        exit 1
      }
      echo "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
      Write-Host "✅ Tailscale连接成功！访问IP：$tsIP"
    } catch {
      Write-Error "❌ Tailscale连接失败：$_"
      exit 1
    }
