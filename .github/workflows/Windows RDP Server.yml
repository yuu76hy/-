name: Windows RDP Server（英文环境+5位密码+5小时）
on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 300  # 5小时超时
    env:
      RDP_USER: vum
      RUN_DURATION: 18000  # 5小时=18000秒

    steps:
      # 启用RDP服务（无需中文配置，简化步骤）
      - name: Enable RDP Service
        shell: pwsh
        run: |
          Write-Host "=== Enabling RDP Service ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
          Restart-Service TermService -Force
          Write-Host "✅ RDP Service enabled"

      # 创建RDP用户（5位数字密码）
      - name: Create RDP User (5-digit password)
        shell: pwsh
        run: |
          Write-Host "=== Creating RDP User ==="
          # 生成5位随机数字密码
          $password = Get-Random -Minimum 10000 -Maximum 99999
          echo "RDP_PWD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          # 创建本地用户并授予管理员权限
          $securePwd = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePwd -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Write-Host "✅ User created successfully! Username: $env:RDP_USER | Password: $password"

      # 安装并连接Tailscale
      - name: Install & Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Installing Tailscale ==="
          # 下载Tailscale安装包
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/windows/tailscale-setup.exe" -OutFile "tailscale.exe"
          # 静默安装
          Start-Process -FilePath .\tailscale.exe -ArgumentList "/silent" -Wait
          
          # 验证Tailscale密钥是否配置
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "❌ TAILSCALE_AUTH_KEY is not configured! Please add it to repository Secrets."
            exit 1
          }
          
          # 连接Tailscale并获取IP
          tailscale up --authkey $env:TAILSCALE_AUTH_KEY --hostname "Windows-RDP-EN"
          $tsIP = tailscale ip -4
          echo "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ Tailscale connected! Access IP: $tsIP"

      # 显示访问信息+保持5小时连接
      - name: Show Access Info & Keep Alive
        shell: pwsh
        run: |
          Write-Host "`n========================================"
          Write-Host "📡 Windows RDP Access Information"
          Write-Host "========================================"
          Write-Host "🔌 Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "👤 Username: $env:RDP_USER"
          Write-Host "🔑 Password: $env:RDP_PWD"
          Write-Host "⏰ Expiration: 5 Hours"
          Write-Host "⚠️  All data will be lost after workflow ends!"
          Write-Host "========================================`n"
          
          # 保持连接，5小时后自动终止
          $startTime = Get-Date
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalSeconds -ge $env:RUN_DURATION) {
              Write-Host "`n⏰ 5 Hours expired! Workflow is terminating."
              exit 0
            }
            $remainingMins = [math]::Round(($env:RUN_DURATION - $elapsed.TotalSeconds)/60)
            Write-Host "[$(Get-Date)] Running - Elapsed: $([math]::Round($elapsed.TotalMinutes)) mins | Remaining: $remainingMins mins"
            Start-Sleep -Seconds 300
          }
