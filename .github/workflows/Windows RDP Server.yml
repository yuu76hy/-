name: Windows RDP Server (English + 5-digit Password + Ngrok)
on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      RDP_USER: vum
      RUN_DURATION: 18000

    steps:
      - name: Enable RDP Service
        shell: pwsh
        run: |
          Write-Host "=== Enabling RDP Service ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
          Restart-Service TermService -Force
          Write-Host "✅ RDP Service enabled"

      - name: Create RDP User (5-digit Password)
        shell: pwsh
        run: |
          Write-Host "=== Creating RDP User ==="
          $password = Get-Random -Minimum 10000 -Maximum 99999
          echo "RDP_PWD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          $securePwd = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePwd -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Write-Host "✅ User created! Username: $env:RDP_USER | Password: $password"

      - name: Install & Connect Ngrok (Stable Alternative)
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Write-Host "=== Installing Ngrok ==="
          # Stable download address (no 404)
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -TimeoutSec 120
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force
          
          # Authenticate Ngrok
          if (-not $env:NGROK_AUTH_TOKEN) {
            Write-Error "❌ NGROK_AUTH_TOKEN is missing! Add it to GitHub Secrets."
            exit 1
          }
          .\ngrok authtoken $env:NGROK_AUTH_TOKEN
          
          # Map RDP port 3389
          Start-Process -FilePath .\ngrok -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 8 # Wait for Ngrok to start
          
          # Get public RDP address
          try {
            $ngrokData = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing -TimeoutSec 10 | ConvertFrom-Json
            $rdpAddress = $ngrokData.tunnels[0].public_url -replace "tcp://", ""
            echo "RDP_ADDR=$rdpAddress" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "✅ Ngrok connected! RDP Address: $rdpAddress"
          } catch {
            Write-Error "❌ Failed to get Ngrok address: $_"
            exit 1
          }

      - name: Show RDP Access Info & Keep Alive
        shell: pwsh
        run: |
          Write-Host "`n========================================"
          Write-Host "📡 Windows RDP Access Information"
          Write-Host "========================================"
          Write-Host "🔌 RDP Address: $env:RDP_ADDR"
          Write-Host "👤 Username: $env:RDP_USER"
          Write-Host "🔑 Password: $env:RDP_PWD"
          Write-Host "⏰ Expiration: 5 Hours"
          Write-Host "========================================`n"
          
          $startTime = Get-Date
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalSeconds -ge $env:RUN_DURATION) {
              Write-Host "⏰ 5 Hours expired! Terminating workflow."
              exit 0
            }
            $remainingMins = [math]::Round(($env:RUN_DURATION - $elapsed.TotalSeconds)/60)
            Write-Host "[$(Get-Date)] Running - Elapsed: $([math]::Round($elapsed.TotalMinutes)) mins | Remaining: $remainingMins mins"
            Start-Sleep -Seconds 300
          }
